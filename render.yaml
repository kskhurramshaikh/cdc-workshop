# Render Blueprint for the CDC privacy-filter hosting stand-in.
#
# NOTE ON SIZING: the real OpenAI Privacy Filter weights are ~2.8GB
# (bf16) and torch/transformers add meaningful overhead on top of that.
# "pro" (2 CPU / 4GB RAM) is the minimum plan likely to hold the model in
# memory with headroom; bump to "pro_plus" (4 CPU / 8GB) if the service
# OOMs or you want the extra CPU for concurrent-request throughput (see
# docs/architecture-sizing.md for the throughput-per-core numbers this is
# based on). Render has no GPU web-service instance type as of this
# writing, which is consistent with our CPU-first architecture decision
# — but it does mean the GPU-batch-throughput open item in
# architecture-sizing.md can't be validated on Render itself.
services:
  - type: web
    name: cdc-privacy-filter
    runtime: python
    plan: pro
    region: oregon
    rootDir: render-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Model download + load can take a couple of minutes on first boot
    # (weights aren't baked into the image) — give it room before Render
    # decides the deploy failed.
    envVars:
      - key: PRIVACY_FILTER_API_KEY
        sync: false  # set manually in the Render dashboard, never committed
      - key: PYTHON_VERSION
        value: "3.11.8"
