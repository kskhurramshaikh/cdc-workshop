# Render Blueprint for Sarhad — Blockverse's privacy-filter MCP service.
#
# Sarhad speaks the real MCP protocol over streamable HTTP (FastMCP,
# render-service/app.py), not a plain REST API — so any MCP client
# (Claude, cdc-mcp-server, or a future paying customer's own agent) can
# connect to it directly with a standard MCP client config pointed at
# https://<this-service>.onrender.com/mcp.
#
# NOTE ON SIZING: the real OpenAI Privacy Filter weights are ~2.8GB
# (bf16) and torch/transformers add meaningful overhead on top of that.
# "pro" (2 CPU / 4GB RAM, $85/mo) is the confirmed-necessary floor —
# live-tested on "standard" (1 CPU / 2GB) first: idle memory alone sat
# at 1.6-1.9GB out of the 2GB cap, and under real load even a single
# detect_pii call on a short sentence took ~19-20s (vs ~1.2s in the
# sandbox benchmark), consistent with memory pressure/thrashing, not a
# code bug — see docs/architecture-sizing.md. Render has no GPU
# web-service instance type as of this writing, which is consistent
# with our CPU-first architecture decision — but it does mean the
# GPU-batch-throughput open item in architecture-sizing.md can't be
# validated on Render itself.
#
# COST: Render has no serverless/scale-to-zero tier for a long-running
# service like this (only the Free tier auto-sleeps, and Workflows
# bill per task-run) — compute is billed prorated to the second while
# the service is live. To avoid paying for idle time between workshop
# sessions, suspend this service in the Render dashboard when it's not
# actively being used, and resume it (allow a few minutes for cold
# start + model reload) before the next session.
services:
  - type: web
    name: sarhad-privacy-filter
    runtime: python
    plan: pro
    region: oregon
    rootDir: render-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    # Plain HTTP route outside the MCP protocol (app.py's @mcp.custom_route),
    # so Render's prober gets an ordinary 2xx GET rather than needing to
    # speak MCP itself.
    healthCheckPath: /health
    # Model download + load can take a couple of minutes on first boot
    # (weights aren't baked into the image) — give it room before Render
    # decides the deploy failed.
    envVars:
      - key: PRIVACY_FILTER_API_KEY
        sync: false  # set manually in the Render dashboard, never committed
      - key: PYTHON_VERSION
        value: "3.11.8"
      # PORT is injected automatically by Render for web services —
      # app.py reads it via os.environ["PORT"]; not set here.
