[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-privacy-filter"
version = "0.1.0"
description = "CDC Privacy Filter by Blockverse — local Pakistani-financial PII redaction/de-redaction"
requires-python = ">=3.10"
readme = "README.md"

# Core package has zero dependencies (regex layer only). The real-model
# Layer 1 (OpenAI Privacy Filter) is an optional extra so the regex layer
# stays installable/testable without pulling in torch/transformers:
#   pip install -e ".[model]"
[project.optional-dependencies]
model = ["torch", "transformers>=4.57", "accelerate", "safetensors"]

[tool.setuptools.packages.find]
include = ["cdc_privacy_filter*"]
